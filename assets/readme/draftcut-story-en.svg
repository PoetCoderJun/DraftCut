ect x="592" y="225" width="560" height="349" rx="20" fill="#183F35"/><text x="620" y="266" font-size="21" fill="#C7E5D0" font-weight="650" >02   MAKE THE IDEA VISIBLE</text><text x="620" y="324" font-size="32" fill="#FFFFFF" font-weight="650" >From problem to solution.</text><rect x="620" y="354" width="212" height="111" rx="14" fill="#F4F3EC"/><text x="641" y="392" font-size="17" fill="#53615A" font-weight="700" >PROBLEM</text><path d="M642 413L798 413" stroke="#C8D2C7" stroke-width="5" fill="none"/><path d="M642 428L778 428" stroke="#C8D2C7" stroke-width="5" fill="none"/><path d="M642 443L758 443" stroke="#C8D2C7" stroke-width="5" fill="none"/><path d="M849 410L880 410" stroke="#C7E5D0" stroke-width="3" fill="none"/><path d="M870 401L880 410L870 419" stroke="#C7E5D0" stroke-width="3" fill="none"/><rect x="898" y="354" width="226" height="111" rx="14" fill="#DAF277"/><text x="919" y="392" font-size="17" fill="#30432A" font-weight="700" >SOLUTION</text><path d="M920 437L931 447L949 423" stroke="#315239" stroke-width="4" fill="none"/><text x="965" y="443" font-size="23" fill="#30432A" font-weight="650" >Show it</text><rect x="620" y="492" width="504" height="48" rx="8" fill="#295447"/><text x="872" y="524" font-size="23" fill="#FFFFFF" font-weight="500" text-anchor="middle">Then show the solution.</text><text x="48" y="631" font-size="27" fill="#182623" font-weight="650" >Your voice stays yours. The story moves forward.</text><text x="48" y="676" font-size="17" fill="#53615A" font-weight="400" >Concept illustration · Your voice · A story brought to life</text></g></svg>
