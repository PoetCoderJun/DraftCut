<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">DraftCut · Recording to video</title><desc id="desc">Original concept: keep the spoken content and original voice, tighten selected gaps and bring out the ideas with diagrams.</desc>
<g font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="28" fill="#F4F3EC"/><text x="48" y="55" font-size="26" fill="#182623" font-weight="750" >DraftCut</text><text x="1152" y="55" font-size="15" fill="#53615A" font-weight="600" text-anchor="end">YOUR VOICE. IN FOCUS.</text><text x="48" y="131" font-size="52" fill="#182623" font-weight="730" >Your idea. Ready to watch.</text><text x="48" y="177" font-size="24" fill="#53615A" font-weight="400" >Keep your voice. Tighten the gaps. Show what matters.</text><rect x="48" y="225" width="450" height="349" rx="20" fill="#FFFFFF"/><text x="76" y="269" font-size="22" fill="#182623" font-weight="650" >01   SPEAK NATURALLY</text><text x="76" y="321" font-size="29" fill="#182623" font-weight="550" >“Start with the problem,</text><text x="76" y="369" font-size="29" fill="#182623" font-weight="550" >then show the solution.”</text><rect x="240" y="405" width="100" height="76" rx="10" fill="#FFE3D6"/><path d="M78 436.0L78 450.0" stroke="#316A59" stroke-width="4" fill="none"/><path d="M89 429.0L89 457.0" stroke="#316A59" stroke-width="4" fill="none"/><path d="M100 423.0L100 463.0" stroke="#316A59" stroke-width="4" fill="none"/><path d="M111 431.0L111 455.0" stroke="#316A59" stroke-width="4" fill="none"/><path d="M122 416.0L122 470.0" stroke="#316A59" stroke-width="4" fill="none"/><path d="M133 426.0L133 460.0" stroke="#316A59" stroke-width="4" fill="none"/><path d="M144 434.5L144 451.5" stroke="#316A59" stroke-width="4" fill="none"/><path d="M155 436.0L155 450.0" stroke="#316A59" stroke-width="4" fill="none"/><path d="M166 429.0L166 457.0" stroke="#316A59" stroke-width="4" fill="none"/><path d="M177 423.0L177 463.0" stroke="#316A59" stroke-width="4" fill="none"/><path d="M188 431.0L188 455.0" stroke="#316A59" stroke-width="4" fill="none"/><path d="M199 416.0L199 470.0" stroke="#316A59" stroke-width="4" fill="none"/><path d="M210 426.0L210 460.0" stroke="#316A59" st