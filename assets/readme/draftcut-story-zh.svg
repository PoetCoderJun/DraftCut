<title id="title">DraftCut — 从自然说话到 TikTok 竖屏短视频</title><desc id="desc">TikTok 展示场景中的原创静态成片代表帧，不播放动画。9:16 竖屏画面通过错落文字和有机流线表现减少任务切换、一次专注一件事。TikTok 仅标示观看场景，不表示合作或关联。前两阶段为自然原声及经过批准的口播精炼。</desc>
<g font-family="'Avenir Next', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Heiti SC', sans-serif">
<rect x="0" y="0" width="1600" height="960" rx="28" fill="#FAF9F6"/>
<text x="56" y="58" font-size="29" fill="#242321" font-weight="650" text-anchor="start" >DraftCut</text>
<text x="1544" y="57" font-size="14" fill="#77736E" font-weight="500" text-anchor="end" letter-spacing="1.4">YOUR VOICE. BEAUTIFULLY TOLD.</text>
<text x="56" y="140" font-size="64" fill="#242321" font-weight="600" text-anchor="start" >你来表达，画面来讲清楚。</text>
<text x="58" y="188" font-size="25" fill="#77736E" font-weight="400" text-anchor="start" >自然地说，保留你的声音。让每个好想法，都有清楚又动人的画面。</text>
<text x="56" y="260" font-size="21" fill="#D95932" font-weight="600" text-anchor="start" >01</text><text x="96" y="260" font-size="28" fill="#242321" font-weight="600" text-anchor="start" >自然说话</text><text x="56" y="296" font-size="19" fill="#77736E" font-weight="400" text-anchor="start" >先说出来，不必一次说完美。</text><path d="M56 315L376 315" fill="none" stroke="#DDD8D0" stroke-width="1" stroke-linecap="round" />
<text x="426" y="260" font-size="21" fill="#D95932" font-weight="600" text-anchor="start" >02</text><text x="466" y="260" font-size="28" fill="#242321" font-weight="600" text-anchor="start" >精炼口播音频</text><text x="426" y="296" font-size="19" fill="#77736E" font-weight="400" text-anchor="start" >口误、重复、口头禅，逐项精炼。</text><path d="M426 315L760 315" fill="none" stroke="#DDD8D0" stroke-width="1" stroke-linecap="round" />
<text x="830" y="260" font-size="21" fill="#D95932" font-weight="600" text-anchor="start" >03</text><text x="870" y="260" font-size="28" fill="#242321" font-weight="600" text-anchor="start" >精美视频</text><text x="830" y="296" font-size="19" fill="#77736E" font-weight="400" text-anchor="start" >用解释性 MG，让观众真正听懂。</text><path d="M830 315L1544 315" fill="none" stroke="#DDD8D0" stroke-width="1" stroke-linecap="round" />
