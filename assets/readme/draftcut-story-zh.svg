<text x="80" y="378" font-size="14" fill="#77736E" font-weight="500" text-anchor="start" letter-spacing="1.4">原始录音</text>
<rect x="79" y="402" width="67" height="33" rx="4" fill="#F6E3DA"/>
<text x="80" y="429" font-size="27" fill="#242321" font-weight="400" text-anchor="start" >“嗯，频繁切换任务，</text>
<text x="80" y="469" font-size="27" fill="#242321" font-weight="400" text-anchor="start" >会打断思路。</text>
<rect x="79" y="482" width="245" height="33" rx="4" fill="#F6E3DA"/>
<text x="80" y="509" font-size="27" fill="#242321" font-weight="400" text-anchor="start" >把同类任务放一起，</text>
<rect x="79" y="522" width="162" height="33" rx="4" fill="#F6E3DA"/>
<text x="80" y="549" font-size="27" fill="#242321" font-weight="400" text-anchor="start" >不，我是说，</text>
<text x="80" y="589" font-size="27" fill="#242321" font-weight="400" text-anchor="start" >把同类任务集中起来。</text>
<rect x="79" y="602" width="162" height="33" rx="4" fill="#F6E3DA"/>
<text x="80" y="629" font-size="27" fill="#242321" font-weight="400" text-anchor="start" >然后，然后，</text>
<text x="80" y="669" font-size="27" fill="#242321" font-weight="400" text-anchor="start" >一次专注一件事。”</text>
<circle cx="66" cy="760" r="4" fill="#D95932"/>
<text x="80" y="766" font-size="18" fill="#77736E" font-weight="400" text-anchor="start" >思考的过程，也值得被保留。</text>
