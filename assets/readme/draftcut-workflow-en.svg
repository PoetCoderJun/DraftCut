<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">DraftCut actual workflow</title><desc id="desc">Recording, gap preparation, director-plan approval, video.</desc>
<g font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1200" height="350" rx="24" fill="#F4F3EC"/><text x="36" y="50" font-size="25" fill="#182623" font-weight="650" >FROM VOICE TO VIDEO</text><rect x="36" y="82" width="258" height="204" rx="16" fill="#FFFFFF"/><text x="58" y="120" font-size="21" fill="#6D7A73" font-weight="650" >01</text><text x="58" y="164" font-size="24" fill="#182623" font-weight="650" >Record</text><text x="58" y="209" font-size="17" fill="#53615A" font-weight="400" >Keep your voice</text><text x="58" y="241" font-size="17" fill="#53615A" font-weight="400" >Choose trim / no trim</text><path d="M303 184L318 184" stroke="#6D7A73" stroke-width="2" fill="none"/><path d="M312 178L318 184L312 190" stroke="#6D7A73" stroke-width="2" fill="none"/><rect x="326" y="82" width="258" height="204" rx="16" fill="#FFFFFF"/><text x="348" y="120" font-size="21" fill="#6D7A73" font-weight="650" >02</text><text x="348" y="164" font-size="24" fill="#182623" font-weight="650" >Tighten gaps</text><text x="348" y="209" font-size="17" fill="#53615A" font-weight="400" >Listen, then select</text><text x="348" y="241" font-size="17" fill="#53615A" font-weight="400" >Align the captions</text><path d="M593 184L608 184" stroke="#6D7A73" stroke-width="2" fill="none"/><path d="M602 178L608 184L602 190" stroke="#6D7A73" stroke-width="2" fill="none"/><rect x="616" y="82" width="258" height="204" rx="16" fill="#183F35"/><text x="638" y="120" font-size="21" fill="#DAF277" font-weight="650" >03</text><text x="638" y="164" font-size="24" fill="#FFFFFF" font-weight="650" >Review the plan</text><text x="638" y="209" font-size="17" fill="#D4E2D7" font-weight="400" >Visuals · focus · pacing</text><text x="638" y="241" font-size="17" fill="#D4E2D7" font-weight="400" >You approve the story</text><path d="M883 184L898 184" stroke="#6D7A73" stroke-width="2" fill="none"/><path d="M892 178L898 184L892 190" stroke="#6D7A73" stroke-width="2" fill="none"/><rect x="906" y="82" width="258" height="204" rx="16" fill="#FFFFFF"/><text x="928" y="120" font-size="21" fill="#6D7A73" font-weight="650" >04</text><text x="928" y="164" font-size="24" fill="#182623" font-weight="650" >Make the video</text><text x="928" y="209" font-size="17" fill="#53615A" font-weight="400" >Preview and listen</text><text x="928" y="241" font-size="17" fill="#53615A" font-weight="400" >Export an MP4</text><text x="36" y="325" font-size="17" fill="#53615A" font-weight="400" >Start with a recording. Add materials and a reference video when you want.</text></g></svg>
