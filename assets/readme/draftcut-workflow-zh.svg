<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">DraftCut 实际工作流程</title><desc id="desc">录音、气口整理、视频脚本审核、成片。</desc>
<g font-family="'Inter', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif"><rect x="0" y="0" width="1200" height="350" rx="24" fill="#F4F3EC"/><text x="36" y="50" font-size="25" fill="#182623" font-weight="650" >从开口，到成片</text><rect x="36" y="82" width="258" height="204" rx="16" fill="#FFFFFF"/><text x="58" y="120" font-size="21" fill="#6D7A73" font-weight="650" >01</text><text x="58" y="164" font-size="24" fill="#182623" font-weight="650" >给出录音</text><text x="58" y="209" font-size="20" fill="#53615A" font-weight="400" >保留你的原声</text><text x="58" y="241" font-size="20" fill="#53615A" font-weight="400" >选择剪 / 不剪</text><path d="M303 184L318 184" stroke="#6D7A73" stroke-width="2" fill="none"/><path d="M312 178L318 184L312 190" stroke="#6D7A73" stroke-width="2" fill="none"/><rect x="326" y="82" width="258" height="204" rx="16" fill="#FFFFFF"/><text x="348" y="120" font-size="21" fill="#6D7A73" font-weight="650" >02</text><text x="348" y="164" font-size="24" fill="#182623" font-weight="650" >整理气口</text><text x="348" y="209" font-size="20" fill="#53615A" font-weight="400" >逐段试听筛选</text><text x="348" y="241" font-size="20" fill="#53615A" font-weight="400" >字幕同步调整</text><path d="M593 184L608 184" stroke="#6D7A73" stroke-width="2" fill="none"/><path d="M602 178L608 184L602 190" stroke="#6D7A73" stroke-width="2" fill="none"/><rect x="616" y="82" width="258" height="204" rx="16" fill="#183F35"/><text x="638" y="120" font-size="21" fill="#DAF277" font-weight="650" >03</text><text x="638" y="164" font-size="24" fill="#FFFFFF" font-weight="650" >审核视频脚本</text><text x="638" y="209" font-size="20" fill="#D4E2D7" font-weight="400" >画面 · 重点 · 节奏</text><text x="638" y="241" font-size="20" fill="#D4E2D7" font-weight="400" >默认人工创意审核</text><path d="M883 184L898 184" stroke="#6D7A73" stroke-width="2" fill="none"/><path d="M892 178L898 184L892 190" stroke="#6D7A73" stroke-width="2" fill="none"/><rect x="906" y="82" width="258" height="204" rx="16" fill="#FFFFFF"/><text x="928" y="120" font-size="21" fill="#6D7A73" font-weight="650" >04</text><text x="928" y="164" font-size="24" fill="#182623" font-weight="650" >制作与交付</text><text x="928" y="209" font-size="20" fill="#53615A" font-weight="400" >连续预览与试听</text><text x="928" y="241" font-size="20" fill="#53615A" font-weight="400" >输出 MP4</text><text x="36" y="325" font-size="17" fill="#53615A" font-weight="400" >云转写需单独授权；当前没有独立的口播稿审核门禁。</text></g></svg>
