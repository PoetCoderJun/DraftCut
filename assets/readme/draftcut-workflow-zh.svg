<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="852" viewBox="0 0 1600 852" role="img" aria-labelledby="title desc">
<title id="title">DraftCut — 口播稿审核、视频脚本审核、成片</title><desc id="desc">原创静态流程示意。先审核口播稿的具体删改，再审核视频脚本的画面、字幕与节奏，批准后制作成片。配有删改稿、分镜与原创静态成片代表帧，不播放动画。</desc>
<g font-family="'Avenir Next', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Heiti SC', sans-serif">
<rect x="0" y="0" width="1600" height="852" rx="28" fill="#FAF9F6"/>
<text x="56" y="57" font-size="27" fill="#242321" font-weight="650" text-anchor="start" >DraftCut</text>
<text x="1544" y="56" font-size="14" fill="#77736E" font-weight="500" text-anchor="end" letter-spacing="1.4">YOU KEEP THE FINAL SAY.</text>
<text x="56" y="135" font-size="56" fill="#242321" font-weight="600" text-anchor="start" >两次确认，把表达握在手里。</text>
<text x="58" y="180" font-size="25" fill="#77736E" font-weight="400" text-anchor="start" >先确认说什么，再确认画面怎么讲。批准后，继续完成制作与交付。</text>
<text x="56" y="250" font-size="21" fill="#D95932" font-weight="600" text-anchor="start" >01</text><text x="96" y="250" font-size="28" fill="#242321" font-weight="600" text-anchor="start" >口播稿审核</text><text x="56" y="286" font-size="19" fill="#77736E" font-weight="400" text-anchor="start" >看删改、听原声，确认表达。</text><path d="M56 305L496 305" fill="none" stroke="#DDD8D0" stroke-width="1" stroke-linecap="round" />
<text x="560" y="250" font-size="21" fill="#D95932" font-weight="600" text-anchor="start" >02</text><text x="600" y="250" font-size="28" fill="#242321" font-weight="600" text-anchor="start" >视频脚本审核</text><text x="560" y="286" font-size="19" fill="#77736E" font-weight="400" text-anchor="start" >看分镜、字幕与节奏，确认画面。</text><path d="M560 305L1040 305" fill="none" stroke="#DDD8D0" stroke-width="1" stroke-linecap="round" />
<text x="1104" y="250" font-size="21" fill="#D95932" font-weight="600" text-anchor="start" >03</text><text x="1144" y="250" font-size="28" fill="#242321" font-weight="600" text-anchor="start" >成片</text><text x="1104" y="286" font-size="19" fill="#77736E" font-weight="400" text-anchor="start" >你的原声，配上清楚动人的画面。</text><path d="M1104 305L1544 305" fill="none" stroke="#DDD8D0" stroke-width="1" stroke-linecap="round" />
